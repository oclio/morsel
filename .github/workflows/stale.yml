name: Stale

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: 🧹 Mark stale issues and PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🧹 Stale
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,enhancement
          exempt-pr-labels: pinned,dependencies,security
          stale-issue-message: >
            This issue has been inactive for 30 days and will be closed in 7 days
            unless there is new activity. Comment to remove the stale label.
          stale-pr-message: >
            This PR has been inactive for 30 days and will be closed in 7 days
            unless there is new activity. Comment or push to remove the stale label.
          close-issue-message: This issue was closed due to inactivity.
          close-pr-message: This PR was closed due to inactivity.
