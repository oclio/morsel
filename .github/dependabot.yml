version: 2
updates:
  - package-ecosystem: 'npm'
    # Wildcard to scan all package.json files in the monorepo
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Europe/Paris'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
    ignore:
      # Lock TypeScript to avoid unexpected breaking changes
      - dependency-name: 'typescript'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
    # Group dependencies by category to reduce PR noise
    groups:
      lint-and-format:
        patterns:
          - 'eslint*'
          - 'prettier*'
          - '@typescript-eslint/*'
      build-and-types:
        # TypeScript patches only (minor/major ignored above)
        patterns:
          - 'typescript'
          - '@types/*'
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - 'dependencies'
